# Pile locale : docker compose up --build  ->  http://localhost:8501

x-app: &app
  build: .
  image: customer-agent
  env_file: .env
  environment:
    MONGO_URI: mongodb://mongo:27017
    MCP_URL: http://mcp:8001/mcp
    API_URL: http://api:8000

services:
  mongo:
    image: mongo:8
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]

  mcp:
    <<: *app
    command: python -m mcp_server.server
    ports: ["8001:8001"]   # exposé pour les clients MCP externes
    depends_on: [mongo]

  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [mongo, mcp]

  ui:
    <<: *app
    command: streamlit run ui/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  mongo-data:
